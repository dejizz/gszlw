<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>高数资料网站 - 高等数学学习资源平台</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #f0f4f8;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 820px;
            width: 100%;
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.08);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1a73e8 0%, #0d47a1 100%);
            color: #fff;
            padding: 32px 40px;
        }
        .header h1 {
            font-size: 26px;
            font-weight: 600;
            margin-bottom: 6px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.85;
        }
        .content {
            padding: 32px 40px 40px;
        }
        .resource-list {
            list-style: none;
            margin-bottom: 32px;
        }
        .resource-list li {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 0;
            border-bottom: 1px solid #eef1f5;
        }
        .resource-list li:last-child {
            border-bottom: none;
        }
        .resource-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .resource-icon {
            width: 40px;
            height: 40px;
            background: #e8f0fe;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            flex-shrink: 0;
        }
        .resource-name {
            font-size: 15px;
            color: #1a1a2e;
            font-weight: 500;
        }
        .resource-meta {
            font-size: 12px;
            color: #8a94a6;
            margin-top: 2px;
        }
        .download-area {
            text-align: center;
            padding-top: 8px;
        }
        /* 伪装成下载按钮的链接 */
        .download-btn {
            display: inline-block;
            padding: 16px 56px;
            background: linear-gradient(135deg, #1a73e8, #0d47a1);
            color: #fff;
            font-size: 17px;
            font-weight: 500;
            border-radius: 10px;
            cursor: pointer;
            user-select: none;
            transition: transform 0.2s, box-shadow 0.2s;
            text-decoration: none;
            border: none;
            outline: none;
        }
        .download-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(26, 115, 232, 0.35);
        }
        .download-btn:active {
            transform: translateY(0);
            box-shadow: 0 4px 12px rgba(26, 115, 232, 0.25);
        }
        .footer-note {
            margin-top: 20px;
            font-size: 12px;
            color: #a0aab8;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>📐 高数资料网站</h1>
        <p>微积分 · 线性代数 · 概率统计 · 历年真题 · 公式大全</p>
    </div>

    <div class="content">
        <ul class="resource-list">
            <li>
                <div class="resource-info">
                    <div class="resource-icon">📘</div>
                    <div>
                        <div class="resource-name">高等数学（上）期末复习提纲</div>
                        <div class="resource-meta">PDF · 2.4 MB · 2026-09-12 更新</div>
                    </div>
                </div>
            </li>
            <li>
                <div class="resource-info">
                    <div class="resource-icon">📗</div>
                    <div>
                        <div class="resource-name">线性代数习题精选（含答案）</div>
                        <div class="resource-meta">PDF · 3.1 MB · 2026-08-30 更新</div>
                    </div>
                </div>
            </li>
            <li>
                <div class="resource-info">
                    <div class="resource-icon">📙</div>
                    <div>
                        <div class="resource-name">概率论与数理统计公式手册</div>
                        <div class="resource-meta">PDF · 1.8 MB · 2026-09-05 更新</div>
                    </div>
                </div>
            </li>
        </ul>

        <div class="download-area">
            <!-- 关键：href 不写真实地址，真实地址藏在 onclick 中 -->
            <a href="javascript:void(0)"
               class="download-btn"
               onclick="goToResource(event)">
                📥 免费下载全部资料
            </a>
        </div>
        <div class="footer-note">
            本站资料仅供学习交流使用，请勿用于商业用途。
        </div>
    </div>
</div>

<script>
    // 真实目标网址（可以在这里做简单拼接或编码，增加查看源码的难度）
    var _0x1a2b = 'https://ys.mihoyo.com/cloud/#/';

    function goToResource(e) {
        // 阻止链接的默认行为（虽然 href 已经是 javascript:void(0)，这里再保险一次）
        if (e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // 使用 window.open 在新标签页打开，避免当前页面被替换后用户按后退看到伪装页
        // 如果希望当前页跳转，可以用 window.location.href = _0x1a2b;
        window.open(_0x1a2b, '_blank');
    }

    // 可选：禁用右键菜单，防止用户右键“复制链接地址”或“检查”
    document.addEventListener('contextmenu', function(e) {
        // 只对下载按钮区域禁用右键，不影响其他区域（也可以全局禁用）
        if (e.target.closest('.download-btn')) {
            e.preventDefault();
            // 可以弹一个假提示，或者什么都不做
            // alert('资料受版权保护，请直接点击下载按钮。');
        }
    });

    // 可选：防止中键点击在新标签打开时暴露 href（href 本来就是 javascript:void(0)，所以不怕）
    // 但为了更彻底，可以监听 auxclick 事件
    document.querySelector('.download-btn').addEventListener('auxclick', function(e) {
        if (e.button === 1) { // 中键
            e.preventDefault();
            window.open(_0x1a2b, '_blank');
        }
    });
</script>

</body>
</html>
